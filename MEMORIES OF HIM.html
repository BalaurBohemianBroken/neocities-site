<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>balaur</title>
    <link href="/Resources/default.css" rel="stylesheet" type="text/css" media="all">
    <link href="/Resources/common.css" rel="stylesheet" type="text/css" media="all">
    <script src="/Resources/all.js"></script>

    <link href="/Resources/MEMORIES OF HIM/MEMORIES OF HIM.css" rel="stylesheet" type="text/css" media="all">
    <script src="/Resources/MEMORIES OF HIM/MEMORIES OF HIM.js"></script>
</head>
<body>
<div id="game" style="display: flex; flex-direction: column; width:100vw; height: 100vh">
    <div id="actArea" style="display: flex; flex-grow: 1; border-bottom: var(--border);">
        <div id="actions" style="flex-grow: 1; border-right: var(--border);">
            <div id="actionWork">
                <p>Burning scent sticks, dim lights, and artifacts given as payment. Mostly, for safety.</p>
            </div>
        </div>
        <div id="thoughts" style="flex-grow: 1"></div>
    </div>
    <div id="playArea" style="flex-grow: 2;">
        <div id="spawnPoint"></div>
        <div class="Card" style="display: flex; flex-direction: column; aspect-ratio: 3/5; width: 80px; border-radius: 10px; background-color: #261e57;">
            <div style="flex-basis: 66%; background-color: #1d0d36; border-bottom: 1px solid black;"></div>
            <div style="flex-basis: 33%; display: flex; align-items: center; justify-content: center;">
                <p style="font-size: var(--text-mid);">INSIGHT</p>
            </div>
        </div>
    </div>
</div>
<p class="version">5.20261112</p>

<div id="prefabs" style="display: none">
    <div class="Card" style="aspect-ratio: 3/5; width: 80px; border-radius: 10px; background-color: #261e57;">
        <p>INSIGHT</p>
    </div>
</div>
</body>
</html>

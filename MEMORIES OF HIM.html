<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>balaur</title>
    <link href="/Resources/default.css" rel="stylesheet" type="text/css" media="all">
    <link href="/Resources/common.css" rel="stylesheet" type="text/css" media="all">
    <script src="/Resources/all.js"></script>

    <link href="/Resources/MEMORIES OF HIM/MEMORIES OF HIM.css" rel="stylesheet" type="text/css" media="all">
    <script src="/Resources/MEMORIES OF HIM/b-prefabs.js"></script>
    <script src="/Resources/MEMORIES OF HIM/MEMORIES OF HIM.js"></script>
</head>
<body>
<div id="game" style="display: flex; flex-direction: column; width:100vw; height: 100vh">
    <div id="actArea" style="display: flex; flex-basis: 40%; border-bottom: var(--border);">
        <div id="actions" style="flex-basis: 50%; border-right: var(--border);">
            <div id="actionWork">
                <p>Burning scent sticks, dim lights, and artifacts given as payment. Mostly, for safety.</p>
            </div>
        </div>
        <div id="thoughts" style="flex-basis: 50%"></div>
    </div>
    <div id="playArea" style="flex-basis: 60%;">
        <b-spawn-zone id="spawnZone" style="position: absolute; width: 400px; height: 150px; left: 50%; transform: translate(-50%, 0); background-color: #1c0f1e; border-radius: 0 0 10px 10px;">
            
        </b-spawn-zone>
    </div>
</div>
<p class="version">10.20261112</p>

<div id="prefabs" style="display: none">
    <b-card style="display: flex; flex-direction: column; aspect-ratio: 3/5; width: 80px; border-radius: 10px; background-color: #261e57; position: absolute; transform: translate(-50%, -50%);">
        <div class="CardArt" style="border-radius: 10px 10px 0 0; flex-basis: 66%; background-color: #1d0d36;"></div>
        <div style="flex-basis: 33%; display: flex; align-items: center; justify-content: center;">
            <p class="CardName" style="font-size: var(--text-mid);">INSIGHT</p>
        </div>
    </b-card>
    <b-card-slot>
        
    </b-card-slot>
</div>
</body>
</html>

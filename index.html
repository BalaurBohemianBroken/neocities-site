<body style="width: max(500px, 100vw); height: max(500px, 100vh); overflow: hidden; display: flex; margin: 0;">
<div id="console" class="VerticalBorder" style="width: 75%; height: 100%; display: flex; white-space: pre; font-size: 1em; overflow-y: scroll;">

</div>
<div id="main_right" style="display: none; width: 25%; height: 100%;">
  <div class="HorizontalBorder">
    <p style="margin: 2px; font-size: 0.8em;">
      <span style="color: red">○</span> <span class="ColorBalaur">balaur</span>.service - <span

      Active: inactive (dead)<br>
      TriggeredBy: <span style="color: green;">●</span> <span class="ColorBalaur">balaur</span>.socket<br>
      Loaded: loaded (/etc/systemd/system/<span class="ColorBalaur">balaur</span>.service; static)<br>
    </p>
  </div>
  <div class="HorizontalBorder" style="aspect-ratio: 4/3; width: 100%;">
    <img src="/Resources/Sona/Corruptions/corrupt01.png" style="object-fit: contain; width: 100%; height: 100%;">
  </div>
  <div class="HorizontalBorder" style="height: 70px;"></div>
</div>

      TriggeredBy: <span style="color: green;">●</span> <span class="ColorBalaur">balaur</span>.socket<br>
      Loaded: loaded (/etc/systemd/system/<span class="ColorBalaur">balaur</span>.service; static)<br>
    </p>
  </div>
  <div class="HorizontalBorder" style="aspect-ratio: 4/3; width: 100%;">
    <img src="/Resources/Sona/Corruptions/corrupt01.png" style="object-fit: contain; width: 100%; height: 100%;">
  </div>
  <div class="HorizontalBorder" style="height: 70px;"></div>
</div>
